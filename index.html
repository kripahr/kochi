<body>
<canvas id="scene"></canvas><canvas id="grain"></canvas><div id="vignette"></div>
<div id="subtitle"></div><div id="hint">move mouse to look · scroll or arrow keys to walk</div>
<script type="module">
import * as THREE from 'three';

const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
renderer.setSize(innerWidth,innerHeight,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=false;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#243044');
scene.fog=new THREE.FogExp2('#243044',0.022);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,85);
camera.position.set(0,1.65,0);
scene.add(camera);

const hemi=new THREE.HemisphereLight('#6a7fa8','#3a3026',.55);scene.add(hemi);
const ambient=new THREE.AmbientLight('#2a3550',.30);scene.add(ambient);
const farLight=new THREE.DirectionalLight('#9fbde8',.35);farLight.position.set(0,4,-33);farLight.target.position.set(0,1,-12);scene.add(farLight,farLight.target);
const hallwayLights=[];
[-4.4,-14.1,-24.1].forEach((z,i)=>{
  const l=new THREE.PointLight('#ffb066',8,9,2);l.position.set(i===1?.12:0,3.02,z);scene.add(l);hallwayLights.push(l);
});
const flashlight=new THREE.SpotLight('#ffe6c0',22,.42,26,.55,2);
flashlight.position.set(.14,-.12,-.03);flashlight.target.position.set(0,-.06,-12);
camera.add(flashlight);camera.add(flashlight.target);

const MAT={
  wood:new THREE.MeshStandardMaterial({color:'#624832',roughness:.82,metalness:0}),
  darkWood:new THREE.MeshStandardMaterial({color:'#362b26',roughness:.78,metalness:0}),
  trim:new THREE.MeshStandardMaterial({color:'#806448',roughness:.76,metalness:0}),
  brass:new THREE.MeshStandardMaterial({color:'#9a7444',roughness:.55,metalness:.25}),
  metal:new THREE.MeshStandardMaterial({color:'#68737a',roughness:.6,metalness:.45}),
  cloth:new THREE.MeshStandardMaterial({color:'#777b80',roughness:.95,metalness:0}),
  paleCloth:new THREE.MeshStandardMaterial({color:'#a6acaf',roughness:.98,metalness:0}),
  shoe:new THREE.MeshStandardMaterial({color:'#5a443a',roughness:.94,metalness:0}),
  dark:new THREE.MeshStandardMaterial({color:'#24272e',roughness:.95,metalness:0}),
  plaster:new THREE.MeshStandardMaterial({color:'#b8b4a5',roughness:.94,metalness:0}),
  warmBulb:new THREE.MeshStandardMaterial({color:'#ffd7a0',emissive:'#ffb45c',emissiveIntensity:1.5,roughness:.3}),
  glass:new THREE.MeshStandardMaterial({color:'#6c87a9',emissive:'#304b72',emissiveIntensity:.45,roughness:.45,metalness:.08}),
  green:new THREE.MeshStandardMaterial({color:'#4d5749',roughness:.95}),
  flower:new THREE.MeshStandardMaterial({color:'#a17f8b',roughness:.9}),
  black:new THREE.MeshStandardMaterial({color:'#1d2027',roughness:.9})
};

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return {canvas:c,ctx:x,tex:t};}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const rnd=seeded(938411);
const floorArt=canvasTex(1024,1024,(c,w,h)=>{
  c.fillStyle='#6f5946';c.fillRect(0,0,w,h);
  const cols=7, cw=w/cols;
  for(let i=0;i<cols;i++){
    const p=rnd(),r=83+Math.floor(p*32),g=62+Math.floor(p*25),b=44+Math.floor(p*18);
    c.fillStyle=`rgb(${r},${g},${b})`;c.fillRect(i*cw+1,0,cw-2,h);
    for(let n=0;n<210;n++){
      const x=i*cw+rnd()*cw,y=rnd()*h;
      c.strokeStyle=rnd()>.5?'rgba(25,17,12,.12)':'rgba(225,190,145,.10)';c.lineWidth=.4+rnd()*1.4;
      c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+(rnd()-.5)*8,y+35,x+(rnd()-.5)*10,y+80,x+(rnd()-.5)*5,y+125);c.stroke();
    }
    c.strokeStyle='rgba(24,18,14,.8)';c.lineWidth=3;c.beginPath();c.moveTo(i*cw,0);c.lineTo(i*cw,h);c.stroke();
    c.strokeStyle='rgba(213,178,136,.18)';c.lineWidth=1;c.beginPath();c.moveTo(i*cw+5,0);c.lineTo(i*cw+5,h);c.stroke();
  }
  for(let y=120;y<h;y+=147){for(let i=0;i<cols;i++){
    const xx=i*cw+(i%2)*cw*.5;
    c.strokeStyle='rgba(25,17,12,.48)';c.lineWidth=2;c.beginPath();c.moveTo(xx,y);c.lineTo(Math.min(xx+cw-3,w),y+1);c.stroke();
  }}
  for(let n=0;n<9000;n++){c.fillStyle=rnd()>.5?'rgba(230,210,180,.045)':'rgba(22,16,12,.045)';c.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*3);}
});
floorArt.tex.repeat.set(1,3);
const floorMat=new THREE.MeshStandardMaterial({map:floorArt.tex,roughness:.83,metalness:0,bumpMap:floorArt.tex,bumpScale:.035});
const wallpaperArt=canvasTex(1024,1024,(c,w,h)=>{
  c.fillStyle='#66717b';c.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=4){c.fillStyle=`rgba(${y%2?36:207},${y%2?43:199},${y%2?51:184},.035)`;c.fillRect(0,y,w,2);}
  const step=166;
  for(let x=0;x<w;x+=step){c.fillStyle='rgba(33,39,45,.65)';c.fillRect(x,0,2,h);c.fillStyle='rgba(197,185,166,.45)';c.fillRect(x+3,0,1,h);}
  for(let x=step/2;x<w+step;x+=step){for(let y=0;y<h;y+=130){
    c.save();c.translate(x,y+65);c.strokeStyle='rgba(181,163,145,.52)';c.fillStyle='rgba(166,145,130,.24)';c.lineWidth=2;
    c.beginPath();c.moveTo(0,-48);c.bezierCurveTo(-26,-33,-23,-9,0,0);c.bezierCurveTo(23,-9,26,-33,0,-48);c.fill();c.stroke();
    c.beginPath();c.ellipse(0,0,8,18,0,0,Math.PI*2);c.stroke();
    for(const side of [-1,1]){c.beginPath();c.moveTo(0,-7);c.quadraticCurveTo(side*26,-16,side*18,-34);c.quadraticCurveTo(side*5,-27,0,-7);c.stroke();c.beginPath();c.ellipse(side*15,-27,4,9,side*.6,0,Math.PI*2);c.fill();}
    c.beginPath();c.moveTo(-10,10);c.quadraticCurveTo(-28,19,-17,31);c.quadraticCurveTo(-4,29,0,12);c.quadraticCurveTo(4,29,17,31);c.quadraticCurveTo(28,19,10,10);c.stroke();
    c.restore();
  }}
  for(let i=0;i<8;i++){const x=rnd()*w,y=rnd()*85+8,g=c.createRadialGradient(x,y,4,x,y,90+rnd()*70);g.addColorStop(0,'rgba(70,62,54,.34)');g.addColorStop(1,'rgba(70,62,54,0)');c.fillStyle=g;c.fillRect(x-160,y-130,320,260);}
  for(let i=0;i<9000;i++){c.fillStyle=rnd()>.5?'rgba(225,220,205,.04)':'rgba(20,29,38,.05)';c.fillRect(rnd()*w,rnd()*h,1,1);}
});
const ceilingArt=canvasTex(512,512,(c,w,h)=>{
  c.fillStyle='#9d9a8e';c.fillRect(0,0,w,h);
  for(let i=0;i<2800;i++){c.fillStyle=rnd()>.5?'rgba(35,40,42,.05)':'rgba(240,233,215,.07)';c.fillRect(rnd()*w,rnd()*h,1+rnd()*3,1+rnd()*2);}
  c.strokeStyle='rgba(61,58,54,.38)';c.lineWidth=2;
  for(let i=0;i<24;i++){const x=rnd()*w,y=rnd()*h;c.beginPath();c.moveTo(x,y);c.lineTo(x+(rnd()-.5)*85,y+rnd()*75);c.lineTo(x+(rnd()-.5)*115,y+rnd()*125);c.stroke();}
});
wallpaperArt.tex.repeat.set(10,1);
const wallpaperMat=new THREE.MeshStandardMaterial({map:wallpaperArt.tex,bumpMap:wallpaperArt.tex,bumpScale:.025,roughness:.94,metalness:0,side:THREE.DoubleSide});
const ceilingMat=new THREE.MeshStandardMaterial({map:ceilingArt.tex,bumpMap:ceilingArt.tex,bumpScale:.025,roughness:.96,side:THREE.DoubleSide});

function box(parent,mat,sx,sy,sz,x,y,z,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);if(opts.rx)m.rotation.x=opts.rx;if(opts.ry)m.rotation.y=opts.ry;if(opts.rz)m.rotation.z=opts.rz;parent.add(m);return m;}
function cylinder(parent,mat,rt,rb,h,x,y,z,seg=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);parent.add(m);return m;}
function sphere(parent,mat,rx,ry,rz,x,y,z,seg=12){const m=new THREE.Mesh(new THREE.SphereGeometry(1,seg,Math.max(6,Math.floor(seg*.65))),mat);m.scale.set(rx,ry,rz);m.position.set(x,y,z);parent.add(m);return m;}
function group(parent,x=0,y=0,z=0){const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);return g;}

// Hall shell: clearly readable even with the flashlight aimed away.
const floor=new THREE.Mesh(new THREE.PlaneGeometry(3.08,35.5),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(0,0,-17.1);scene.add(floor);
const leftWall=new THREE.Mesh(new THREE.PlaneGeometry(35.5,3.38),wallpaperMat);leftWall.rotation.y=-Math.PI/2;leftWall.position.set(-1.56,1.69,-17.1);scene.add(leftWall);
const rightWall=new THREE.Mesh(new THREE.PlaneGeometry(35.5,3.38),wallpaperMat);rightWall.rotation.y=Math.PI/2;rightWall.position.set(1.56,1.69,-17.1);scene.add(rightWall);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(3.15,35.5),ceilingMat);ceiling.rotation.x=Math.PI/2;ceiling.position.set(0,3.38,-17.1);scene.add(ceiling);
box(scene,MAT.plaster,3.15,3.38,.14,0,1.69,-34.9);
// Scuffed wooden baseboards and chair rail.
for(const side of [-1,1]){
  box(scene,MAT.darkWood,.11,.23,35.5,side*1.49,.13,-17.1);
  box(scene,MAT.trim,.075,.065,35.5,side*1.49,1.04,-17.1);
  box(scene,MAT.wood,.09,.035,35.5,side*1.49,.275,-17.1);
  for(let z=-.6;z>-34;z-=2.8){box(scene,MAT.trim,.075,.075,.028,side*1.49,.27,z);}
}
// Ceiling fixtures, warm pools and a mild always-on flicker.
const fixtures=[];
for(const z of [-4.4,-14.1,-24.1]){
  const f=group(scene,0,3.27,z);cylinder(f,MAT.brass,.11,.14,.07,0,0,0,10);sphere(f,MAT.warmBulb,.105,.075,.105,0,-.08,0,10);
  box(f,MAT.darkWood,.34,.025,.23,0,.11,0);
  fixtures.push(f);
}
// Hanging cord, kept out of the walking path.
cylinder(scene,MAT.dark,.012,.01,.46,-.32,2.92,-19.1,6);sphere(scene,MAT.darkWood,.055,.045,.055,-.32,2.68,-19.1,8);

// Far window with procedurally-painted twilight and tree silhouettes.
const windowArt=canvasTex(512,640,(c,w,h)=>{
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#647da4');g.addColorStop(.48,'#8297af');g.addColorStop(.74,'#b0a4a0');g.addColorStop(1,'#454d5b');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(38,49,62,.7)';
  for(let i=0;i<22;i++){const x=rnd()*w,y=300+rnd()*220;c.beginPath();c.moveTo(x,y+125);c.lineTo(x-22-rnd()*18,y+20);c.lineTo(x-4,y+43);c.lineTo(x+8,y-8);c.lineTo(x+25,y+40);c.lineTo(x+43,y+12);c.lineTo(x+32,y+125);c.fill();}
  c.fillStyle='rgba(226,192,153,.3)';c.fillRect(0,450,w,190);
});
const windowMat=new THREE.MeshStandardMaterial({map:windowArt.tex,emissive:'#263d60',emissiveMap:windowArt.tex,emissiveIntensity:.24,roughness:.7,side:THREE.DoubleSide});
const windowGroup=group(scene,0,1.95,-34.78);
box(windowGroup,MAT.darkWood,1.45,2.42,.13,0,0,0);
const windowPane=new THREE.Mesh(new THREE.PlaneGeometry(1.17,2.12),windowMat);windowPane.position.set(0,0,.075);windowGroup.add(windowPane);
for(const x of [-.62,.62])box(windowGroup,MAT.trim,.09,2.32,.1,x,0,.12);
for(const y of [-1.12,0,1.12])box(windowGroup,MAT.trim,1.31,.075,.1,0,y,.12);

// Doors: real slabs and inset raised panels, some left ajar.
const doors=[];
function makeDoor(side,z,ajar=false){
  const pivot=group(scene,side*1.43,0,z);const leaf=group(pivot,0,0,0);
  box(leaf,MAT.darkWood,.09,2.22,.88,0,1.12,side*.40);
  const panelMat=new THREE.MeshStandardMaterial({color:'#59443a',roughness:.84});
  for(const y of [.58,1.36]){
    box(leaf,panelMat,.035,.58,.32,side*.052,y,side*.40);
    box(leaf,MAT.trim,.022,.035,.38,side*.075,y-.31,side*.40);
    box(leaf,MAT.trim,.022,.035,.38,side*.075,y+.31,side*.40);
  }
  for(const zz of [side*.20,side*.60])box(leaf,MAT.trim,.024,.61,.027,side*.077,1.12,zz);
  sphere(leaf,MAT.brass,.035,.035,.035,side*.12,1.0,side*.12,8);
  // Visible dark gap behind a few half-open doors.
  if(ajar){leaf.rotation.y=side*.17;box(pivot,MAT.black,.035,2.1,.77,-side*.045,1.08,-side*.35);}
  doors.push({pivot,leaf,side,z,base:leaf.rotation.y,open:leaf.rotation.y,anim:null});return leaf;
}
makeDoor(-1,-3.5,true);makeDoor(1,-6.8,false);makeDoor(-1,-11.2,false);makeDoor(1,-16.6,true);makeDoor(-1,-21.0,false);makeDoor(1,-26.0,false);

// Framed pictures and the family portrait.
function makeFrame(side,z,y=2.05,w=.57,h=.73,family=false){
  const g=group(scene,side*1.465,y,z);
  box(g,MAT.darkWood,.085,h+.1,w+.1,0,0,0);
  box(g,MAT.brass,.055,h+.025,w+.025,side*.052,0,0);
  const art=family?familyArt.tex:makeSmallPicture();
  const mat=new THREE.MeshStandardMaterial({map:art,roughness:.8,metalness:0,side:THREE.DoubleSide,emissive:family?'#6a4827':'#202733',emissiveIntensity:family?.07:.02});
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);p.rotation.y=side===1?-Math.PI/2:Math.PI/2;p.position.x=side*.09;g.add(p);
  return {group:g,mesh:p,mat};
}
function makeSmallPicture(){return canvasTex(256,320,(c,w,h)=>{c.fillStyle='#5b625e';c.fillRect(0,0,w,h);c.fillStyle='#a7a18d';c.fillRect(16,16,w-32,h-32);c.fillStyle='#64615b';c.beginPath();c.ellipse(128,103,49,63,0,0,Math.PI*2);c.fill();c.fillStyle='#363b42';c.fillRect(64,170,128,105);c.strokeStyle='rgba(232,215,185,.4)';c.lineWidth=3;c.beginPath();c.moveTo(38,42);c.lineTo(220,277);c.stroke();}).tex;}
let familyCloser=false,familyMissing=false,familyGaze=0;
const familyArt=canvasTex(512,640,(c,w,h)=>{drawFamily(c,w,h,false,false,0);});
function drawFamily(c,w,h,closer,missing,gaze){
  c.clearRect(0,0,w,h);const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#d0b98f');bg.addColorStop(1,'#6c503c');c.fillStyle=bg;c.fillRect(0,0,w,h);
  c.fillStyle='rgba(61,42,31,.23)';c.fillRect(16,18,w-32,h-36);
  c.fillStyle='#80664e';c.fillRect(28,28,w-56,h-56);
  const scale=closer?1.11:1;
  function person(x,y,r,coat,tilt=0,blur=false,isFather=false){
    c.save();c.translate(x,y);c.rotate(tilt);c.scale(scale,scale);if(blur)c.filter='blur(5px)';
    c.fillStyle=coat;c.beginPath();c.moveTo(-r*1.45,r*3.3);c.quadraticCurveTo(-r*1.4,r*1.4,-r*.85,r*1.2);c.lineTo(r*.85,r*1.2);c.quadraticCurveTo(r*1.5,r*1.5,r*1.55,r*3.3);c.fill();
    c.fillStyle='#b99b7c';c.beginPath();c.ellipse(0,0,r*.84,r*1.05,0,0,Math.PI*2);c.fill();
    c.fillStyle='#4b382d';c.beginPath();c.ellipse(0,-r*.52,r*.88,r*.42,0,Math.PI,Math.PI*2);c.fill();
    c.fillStyle='#211c19';c.beginPath();c.arc(-r*.29,-r*.06,Math.max(3,r*.075),0,Math.PI*2);c.arc(r*.29+ (isFather?gaze*2:0),-r*.06,Math.max(3,r*.075),0,Math.PI*2);c.fill();
    c.strokeStyle='#2e1714';c.lineWidth=Math.max(2,r*.085);c.beginPath();c.moveTo(-r*.58,r*.36);c.quadraticCurveTo(0,r*1.04,r*.58,r*.36);c.stroke();
    c.restore();
  }
  // Parents in back, three children in front; the left child is blurred until the photo changes.
  person(w*.33,h*.34,48,'#383a3a',-.12,false,false);
  person(w*.68,h*.34,51,'#373c40',-.12,false,true);
  if(!missing)person(w*.24,h*.70,34,'#4a4645',-.10,true,false);
  person(w*.50,h*.70,36,'#373f47',-.10,false,false);
  person(w*.76,h*.70,34,'#49413b',-.10,false,false);
  c.fillStyle='rgba(44,31,24,.14)';for(let i=0;i<9000;i++){const x=rnd()*w,y=rnd()*h;c.fillRect(x,y,1,1);}
  c.strokeStyle='rgba(226,198,151,.34)';c.lineWidth=2;c.strokeRect(8,8,w-16,h-16);
}
function redrawFamily(){drawFamily(familyArt.ctx,512,640,familyCloser,familyMissing,familyGaze);familyArt.tex.needsUpdate=true;}
const frames=[];
frames.push(makeFrame(-1,-5.5,2.03,.55,.7,false));
frames.push(makeFrame(1,-8.7,2.18,.87,1.12,true));
frames.push(makeFrame(-1,-15.2,2.0,.5,.68,false));
frames.push(makeFrame(1,-22.8,2.05,.56,.74,false));
const familyFrame=frames[1];

// Props with thickness and grounded silhouettes.
const chair=group(scene,-.90,.0,-9.1);
box(chair,MAT.wood,.52,.12,.48,0,.49,0);box(chair,MAT.wood,.5,.53,.105,0,.83,-.19);
for(const x of [-.21,.21])for(const z of [-.18,.18])box(chair,MAT.darkWood,.07,.5,.07,x,.25,z);
for(const x of [-.22,.22])box(chair,MAT.trim,.06,.08,.08,x,.86,-.19);
const chairHome=chair.position.clone();
const table=group(scene,.92,0,-8.25);
box(table,MAT.darkWood,.77,.13,.61,0,.78,0);box(table,MAT.trim,.72,.04,.56,0,.86,0);
for(const x of [-.29,.29])for(const z of [-.21,.21])box(table,MAT.wood,.075,.78,.075,x,.39,z);
// Telephone and cradle.
const phone=group(table,0,.95,-.04);
box(phone,MAT.darkWood,.31,.14,.19,0,0,0);box(phone,MAT.brass,.24,.035,.16,0,.08,0);
const handset=group(phone,0,.14,0);box(handset,MAT.darkWood,.28,.07,.06,0,0,0,{rz:-.08});
for(const x of [-.12,.12])sphere(handset,MAT.black,.045,.035,.055,x,.01,0,8);
// Table lamp.

    case 2: {const old=childMode,wasVisible=child.visible,oldPos=child.position.clone(),oldRot=child.rotation.y;child.visible=true;childMode='scare';child.position.set(camera.position.x,0,camera.position.z-.52);child.rotation.y=Math.PI;childOpacity(1);jumpProp={kind:'child',until:elapsed+.28,old,wasVisible,oldPos,oldRot};break;}
    case 3: silhouette.visible=true;silhouette.position.set(-1.23,0,camera.position.z-2.5);jumpProp={kind:'silhouette',until:elapsed+.46};break;
    case 4: sister.visible=true;sister.position.set(.87,.98,camera.position.z-1.2);jumpProp={kind:'sister',until:elapsed+.53};break;
    case 5: brother.visible=true;brother.position.set(-1.03,0,camera.position.z-2.7);jumpProp={kind:'brother',until:elapsed+.6};break;
    case 6: lightHardUntil=elapsed+.07;playTone(125,.24,.18,'sawtooth',55,0);jumpProp={kind:'light',until:elapsed+.12};break;
  }
}

// Averted gaze permanently changes the portrait when the player looks back.
let photoWasVisible=false,photoAwaySince=null,photoChanged=false,photoUpdateClock=0;
function photoVisibility(){
  const v=new THREE.Vector3();camera.getWorldDirection(v);const to=new THREE.Vector3().subVectors(familyFrame.group.position,camera.position).normalize();
  const dot=v.dot(to);const visible=dot>.78;
  if(!visible){if(photoWasVisible&&photoAwaySince===null)photoAwaySince=elapsed;}
  else if(elapsed>=29&&photoAwaySince!==null&&elapsed-photoAwaySince>.25&&!photoChanged){familyCloser=true;familyMissing=true;photoChanged=true;redrawFamily();photoAwaySince=null;}
  if(visible)photoWasVisible=true;else if(elapsed<28)photoWasVisible=false;
  photoUpdateClock+=clockDelta;
  if(photoUpdateClock>.25){photoUpdateClock=0;familyGaze=THREE.MathUtils.clamp(yaw*1.8,-.9,.9);redrawFamily();}
}

// Active scripted events that animate in continuous time.
let nextHouseEvent=100,houseEventUntil=0,houseEvent=null,lightDipUntil=-1,lightHardUntil=-1,chairEvent=null,pictureEvent=null,doorEvent=null,silhouetteEvent=null,mirrorEventUntil=-1,dustPullUntil=-1,phoneJitterUntil=-1;
function triggerHouseEvent(){
  const choices=['phone','chair','door','picture','silhouette','bulb','giggle','mirror','steps','dust'];
  const ev=choices[Math.floor(rand()*choices.length)];houseEvent=ev;houseEventUntil=elapsed+({phone:2.5,chair:1.4,door:1.25,picture:1.3,silhouette:.75,bulb:.7,giggle:.65,mirror:.4,steps:1.0,dust:1.5}[ev]||1);
  if(ev==='phone'){playPhone();lightDipUntil=elapsed+.3;phoneJitterUntil=elapsed+2.5;}
  if(ev==='chair'){chairEvent={start:elapsed,dur:1.0,from:chair.position.x,to:chair.position.x+(rand()>.5?.30:-.30)};playScrape();}
  if(ev==='door'){const leftDoors=doors.filter(d=>d.side===-1);const d=leftDoors[Math.floor(rand()*leftDoors.length)];doorEvent={door:d,start:elapsed,phase:'open',from:d.leaf.rotation.y,to:d.side*.44};playCreak(.20);}
  if(ev==='picture'){const f=frames[Math.floor(rand()*frames.length)];pictureEvent={frame:f,start:elapsed,from:f.group.rotation.z,to:(rand()>.5?1:-1)*THREE.MathUtils.degToRad(12)};playCreak(.11);}
  if(ev==='silhouette'){silhouette.visible=true;silhouette.position.set(-1.1,0,-32.4);silhouetteEvent={start:elapsed,from:-1.1,to:1.1};playNoise(.18,.06,320,.2);}
  if(ev==='bulb'){lightHardUntil=elapsed+.6;playTone(760,.55,.055,'sawtooth',580,0);}
  if(ev==='giggle'){playGiggle();}
  if(ev==='mirror'){mirrorFace.visible=true;mirrorEventUntil=elapsed+.35;playTone(320,.24,.045,'sine',255,-.5);}
  if(ev==='steps'){playFootsteps();}
  if(ev==='dust'){dustPullUntil=elapsed+1.3;playNoise(.35,.07,550,0);}
  nextHouseEvent=houseEventUntil+4+rand()*5;
}

const clock=new THREE.Clock();let clockDelta=0,elapsedPrev=0,walkAmount=0,headBob=0,camShake=0,lightDip=1;
function updateTimeline(){for(const e of timeline){if(!e.done&&elapsed>=e.time){e.done=true;try{e.fn();}catch(err){/* Keep the rendered scene alive if a single story beat fails. */}}}}
function updateActor(dt){
  const moveOutT=elapsed-6.0;
  if(childMode==='stepout'){
    const p=THREE.MathUtils.clamp(moveOutT/.65,0,1);child.position.x=.86*(1-p);child.position.z=-24.8-Math.min(6.4,Math.max(0,moveOutT-.6)*1.05);child.rotation.y=0;
    if(elapsed>15.4){childMode='fade';childFadeStart=15.4;}
  }
  if(childMode==='fade'){const op=1-THREE.MathUtils.clamp((elapsed-childFadeStart)/.55,0,1);childOpacity(op);if(op<=0){child.visible=false;childMode='hidden';}}
  if(childMode==='return'){
    child.visible=true;const target=camera.position.z-1.65;child.position.z=Math.min(target,child.position.z+dt*10.8);child.position.x=THREE.MathUtils.lerp(child.position.x,camera.position.x,.08);child.rotation.y=Math.PI;
    if(child.position.z>=target-.025){child.position.z=target;childMode='facePlayer';drawChildFace(faceArt.ctx,512,640,true,1.18);faceArt.tex.needsUpdate=true;}
  }
  if(childMode==='facePlayer'){child.position.z=camera.position.z-1.65;child.position.x=THREE.MathUtils.lerp(child.position.x,camera.position.x,.07);child.rotation.y=Math.PI;}
  if(childMode==='toPhoto'){
    child.visible=true;const tz=-10.0;child.position.z=THREE.MathUtils.lerp(child.position.z,tz,Math.min(1,dt*.72));child.position.x=THREE.MathUtils.lerp(child.position.x,1.0,Math.min(1,dt*.75));child.rotation.y=THREE.MathUtils.lerp(child.rotation.y,Math.PI*1.5,Math.min(1,dt*1.7));
    if(Math.abs(child.position.z-tz)<.08&&Math.abs(child.position.x-1)<.08)childMode='photo';
  }
  if(childMode==='photo'||childMode==='waitBrother'||childMode==='callSister'||childMode==='chatter'){child.visible=true;child.position.z=THREE.MathUtils.lerp(child.position.z,-10.0,Math.min(1,dt*.25));child.position.x=THREE.MathUtils.lerp(child.position.x,1.0,Math.min(1,dt*.25));}
  if(childMode==='ending'){child.position.z-=dt*.65;child.position.x=THREE.MathUtils.lerp(child.position.x,1.6,dt*.3);child.rotation.y=THREE.MathUtils.lerp(child.rotation.y,Math.PI*1.5,dt*.4);if(child.position.x>1.45)child.visible=false;}
  if(brotherMode==='enter'){
    brother.visible=true;brother.position.x=THREE.MathUtils.lerp(brother.position.x,.12,Math.min(1,dt*.85));brother.position.z=THREE.MathUtils.lerp(brother.position.z,-14.2,Math.min(1,dt*.85));
  }else if(brotherMode==='bolt'){
    brother.visible=true;brother.position.z+=dt*12.5;brother.position.x=THREE.MathUtils.lerp(brother.position.x,camera.position.x+(brother.position.x<camera.position.x?-.20:.2),dt*1.6);if(brother.position.z>camera.position.z+1.6){brother.visible=false;brotherMode='hidden';}
  }
  if(headMode==='roll'){
    sister.visible=true;sister.position.z=Math.min(child.position.z,sister.position.z+dt*4.3);sister.position.x=THREE.MathUtils.lerp(sister.position.x,child.position.x,.008);sister.rotation.z+=dt*6.4;
    if(sister.position.z>=child.position.z-.12){headMode='rest';sister.position.z=child.position.z-.12;sister.rotation.z=.08;}
  }
  if(headMode==='rest'){sister.position.x=child.position.x;sister.position.z=child.position.z-.12;sister.rotation.x=Math.PI/2;sister.rotation.y=Math.PI;sisterFace.scale.y=1+.045*Math.sin(elapsed*11.5);}
}
function updateAnimations(dt){
  hallwayLights.forEach((l,i)=>{const mild=.94+.06*Math.sin(elapsed*5.3+i*1.7);const hard=elapsed<lightHardUntil?1.65:1;const dip=elapsed<lightDipUntil?.85:1;l.intensity=8*mild*hard*dip;});
  fixtures.forEach((f,i)=>{f.rotation.z=.012*Math.sin(elapsed*2+i);});
  lampGlow.intensity=.9+.08*Math.sin(elapsed*1.7);
  if(doorEvent){const p=THREE.MathUtils.clamp((elapsed-doorEvent.start)/.32,0,1);if(doorEvent.phase==='open'){doorEvent.door.leaf.rotation.y=THREE.MathUtils.lerp(doorEvent.from,doorEvent.to,p);if(p>=1){doorEvent.phase='slam';doorEvent.start=elapsed;playSlam();}}else{const q=THREE.MathUtils.clamp((elapsed-doorEvent.start)/.16,0,1);doorEvent.door.leaf.rotation.y=THREE.MathUtils.lerp(doorEvent.to,doorEvent.from,q);if(q>=1)doorEvent=null;}}
  if(pictureEvent){const p=THREE.MathUtils.clamp((elapsed-pictureEvent.start)/.35,0,1);pictureEvent.frame.group.rotation.z=THREE.MathUtils.lerp(pictureEvent.from,pictureEvent.to,p);if(p>=1){pictureEvent.frame.group.rotation.z=THREE.MathUtils.lerp(pictureEvent.to,0,THREE.MathUtils.clamp((elapsed-pictureEvent.start-.55)/.4,0,1));if(elapsed-pictureEvent.start>1.0)pictureEvent=null;}}
  if(chairEvent){const p=THREE.MathUtils.clamp((elapsed-chairEvent.start)/chairEvent.dur,0,1);if(!lookingAtChair())chair.position.x=THREE.MathUtils.lerp(chairEvent.from,chairEvent.to,p);if(p>=1)chairEvent=null;}
  if(silhouetteEvent){const p=THREE.MathUtils.clamp((elapsed-silhouetteEvent.start)/.62,0,1);silhouette.position.x=THREE.MathUtils.lerp(silhouetteEvent.from,silhouetteEvent.to,p);if(p>=1){silhouette.visible=false;silhouetteEvent=null;}}
  if(mirrorEventUntil>0&&elapsed>=mirrorEventUntil){mirrorFace.visible=false;mirrorEventUntil=-1;}
  if(elapsed<phoneJitterUntil){handset.rotation.z=.09*Math.sin(elapsed*42);handset.position.x=.012*Math.sin(elapsed*65);}else{handset.rotation.z=0;handset.position.x=0;}
  if(jumpProp&&elapsed>=jumpProp.until){if(jumpProp.kind==='mirror')mirrorFace.visible=false;if(jumpProp.kind==='child'){childMode=jumpProp.old||'hidden';child.position.copy(jumpProp.oldPos);child.rotation.y=jumpProp.oldRot;child.visible=jumpProp.wasVisible;}if(jumpProp.kind==='silhouette')silhouette.visible=false;if(jumpProp.kind==='sister'){sister.visible=headMode==='rest'||headMode==='roll';}if(jumpProp.kind==='brother'){brother.visible=brotherMode==='enter'||brotherMode==='bolt';}jumpProp=null;}
  if(elapsed<jumpUntil){camera.fov=70+6*Math.sin(Math.PI*THREE.MathUtils.clamp((elapsed-lastJump)/Math.max(.001,jumpUntil-lastJump),0,1));camera.updateProjectionMatrix();}else if(camera.fov!==70){camera.fov=THREE.MathUtils.lerp(camera.fov,70,.25);camera.updateProjectionMatrix();}
  if(jumpShakeFrames>0){camShake=.035;jumpShakeFrames--;}else camShake=0;
  if(elapsed<dustPullUntil){for(let i=0;i<dustCount;i++){const p=i*3;const tx=chair.position.x*.15,ty=1.2,tz=camera.position.z-5;dustPos[p]+=(tx-dustPos[p])*.004;dustPos[p+1]+=(ty-dustPos[p+1])*.004;dustPos[p+2]+=(tz-dustPos[p+2])*.004;}}
}
function lookingAtChair(){const f=new THREE.Vector3();camera.getWorldDirection(f);const t=new THREE.Vector3(chair.position.x-camera.position.x,chair.position.y+.8-camera.position.y,chair.position.z-camera.position.z).normalize();return f.dot(t)>.965;}
function updateMovement(dt){
  yaw=THREE.MathUtils.lerp(yaw,targetYaw,.08);pitch=THREE.MathUtils.lerp(pitch,targetPitch,.08);
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
  const fw=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
  const str=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);
  const kz=fw*2.2*dt+wheelVelocity*dt;
  const kx=str*1.8*dt;
  const oldZ=camera.position.z;camera.position.z=THREE.MathUtils.clamp(camera.position.z-kz,-32,0);camera.position.x=THREE.MathUtils.clamp(camera.position.x+kx,-1.15,1.15);
  wheelVelocity*=Math.exp(-dt*3.4);if(Math.abs(wheelVelocity)<.02)wheelVelocity=0;
  const moved=Math.abs(camera.position.z-oldZ)+Math.abs(kx);walkAmount=moved>0.0008?Math.min(1,walkAmount+dt*2.8):Math.max(0,walkAmount-dt*2);
  if(moved>.0008)walkPhase+=dt*8.5;
  headBob=Math.sin(walkPhase)*.035*walkAmount;
  const breathing=Math.sin(elapsed*1.35)*.0105;
  camera.position.y=1.65+headBob+breathing;
  camera.position.x+=Math.sin(elapsed*27.4)*.0012+camShake*(rand()-.5);
  camera.rotation.z=Math.sin(elapsed*1.1)*.0018+camShake*(rand()-.5)*.025;
}
function updateDust(dt){for(let i=0;i<dustCount;i++){const p=i*3;dustPos[p]+=dustVelocity[p]*dt;dustPos[p+1]+=dustVelocity[p+1]*dt;dustPos[p+2]+=dustVelocity[p+2]*dt;if(dustPos[p]<-1.48||dustPos[p]>1.48)dustVelocity[p]*=-1;if(dustPos[p+1]<.15||dustPos[p+1]>3.1)dustVelocity[p+1]*=-1;if(dustPos[p+2]>camera.position.z+1||dustPos[p+2]<-34)dustPos[p+2]=camera.position.z-4-rand()*27;}dustGeo.attributes.position.needsUpdate=true;}
function updateSubtitle(){if(!subtitleFull)return;if(elapsed>=subtitleUntil){subtitleEl.textContent='';subtitleFull='';return;}subtitleTyped=Math.min(subtitleFull.length,Math.floor((elapsed-lastSubtitleStart)*35));subtitleEl.textContent=subtitleFull.slice(0,subtitleTyped);}
function updateHeartbeat(){if(audioCtx&&elapsed>20&&elapsed-lastBeat>beatInterval){lastBeat=elapsed;playHeartbeat();beatInterval=THREE.MathUtils.lerp(1.18,.62,THREE.MathUtils.clamp(elapsed/160,0,1));}}
let frameN=0;
function animate(){requestAnimationFrame(animate);clockDelta=Math.min(clock.getDelta(),.05);elapsed+=clockDelta;updateTimeline();updateMovement(clockDelta);updateActor(clockDelta);photoVisibility();updateAnimations(clockDelta);updateDust(clockDelta);updateSubtitle();updateHeartbeat();
  if(elapsed>=80&&!ending&&elapsed>=nextHouseEvent&&elapsed>houseEventUntil)triggerHouseEvent();
  if(++frameN%3===0)refreshGrain();
  renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();resizeGrain();refreshGrain();});
// Keep the child's face blank until the scripted return; the sister's separate texture is already smiling.
faceArt.tex.needsUpdate=true;sisterFaceArt.tex.needsUpdate=true;
// First frame is rendered synchronously so the hallway is visible immediately.
renderer.render(scene,camera);
animate();
</script>
