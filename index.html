<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rainfall — a quiet storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05080c;
  }

  .scene {
    position: fixed;
    inset: 0;
    overflow: hidden;
    isolation: isolate;
  }

  /* ---------- SKY ---------- */
  .sky {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(130% 100% at 50% -10%,
        #243543 0%,
        #172430 28%,
        #0e171f 55%,
        #070c11 80%,
        #04070a 100%);
  }

  .glow {
    position: absolute;
    left: 50%;
    top: -30%;
    width: 110vmax;
    height: 90vmax;
    transform: translateX(-50%);
    background: radial-gradient(circle at 50% 50%,
      rgba(158, 198, 222, 0.16) 0%,
      rgba(120, 165, 195, 0.07) 32%,
      rgba(90, 130, 160, 0.02) 52%,
      transparent 68%);
    filter: blur(12px);
    animation: glowPulse 14s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes glowPulse {
    from { opacity: .65; }
    to   { opacity: 1; }
  }

  /* ---------- CLOUDS ---------- */
  .clouds {
    position: absolute;
    inset: -15% -25%;
    pointer-events: none;
  }
  .cloud {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(146, 180, 205, 0.20) 0%,
      rgba(112, 148, 175, 0.08) 42%,
      transparent 70%);
    filter: blur(30px);
    animation-name: cloudDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    will-change: transform;
  }
  @keyframes cloudDrift {
    from { transform: translate3d(-9vw, 0, 0) scale(1); }
    to   { transform: translate3d(9vw, 3vh, 0) scale(1.1); }
  }

  /* ---------- TREE LAYERS ---------- */
  .trees {
    position: absolute;
    left: 0;
    right: 0;
    pointer-events: none;
  }
  .trees svg { display: block; overflow: visible; }

  .trees-far  { bottom: 30vh; height: 20vh; filter: blur(0.9px); }
  .trees-mid  { bottom: 15vh; height: 30vh; }
  .trees-near { bottom: 0;    height: 44vh; }

  .tree {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation-name: sway;
    animation-duration: var(--dur, 6s);
    animation-delay: var(--delay, 0s);
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    will-change: transform;
  }

  @keyframes sway {
    0%   { transform: rotate(calc(var(--ang) * -1deg)); }
    45%  { transform: rotate(calc(var(--ang) * 0.8deg)); }
    75%  { transform: rotate(calc(var(--ang) * -0.35deg)); }
    100% { transform: rotate(calc(var(--ang) * -1deg)); }
  }

  /* ---------- FOG ---------- */
  .fog {
    position: absolute;
    left: -25%;
    right: -25%;
    height: 46vh;
    pointer-events: none;
    filter: blur(26px);
    animation: fogDrift 26s ease-in-out infinite alternate;
  }
  .fog-a {
    bottom: 6vh;
    background: radial-gradient(60% 100% at 50% 100%,
      rgba(150, 182, 208, 0.16), transparent 72%);
  }
  .fog-b {
    bottom: -8vh;
    background: radial-gradient(65% 100% at 50% 100%,
      rgba(165, 198, 222, 0.14), transparent 74%);
    animation-duration: 34s;
    animation-delay: -8s;
  }
  @keyframes fogDrift {
    from { transform: translate3d(-6vw, 0, 0) scaleY(1); opacity: .75; }
    to   { transform: translate3d(6vw, -2vh, 0) scaleY(1.12); opacity: 1; }
  }

  /* ---------- RAIN ---------- */
  #rain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: block;
  }

  /* ---------- VIGNETTE ---------- */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(120% 95% at 50% 42%,
        transparent 25%,
        rgba(2, 5, 8, 0.35) 70%,
        rgba(1, 3, 5, 0.78) 100%);
  }

  /* ---------- CONTENT ---------- */
  .content {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.4rem;
    text-align: center;
    pointer-events: none;
    padding-bottom: 10vh;
    animation: fadeUp 3.2s cubic-bezier(.22,.9,.3,1) 0.5s both;
  }

  .content h1 {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 300;
    font-size: clamp(2.6rem, 9vw, 7rem);
    letter-spacing: 0.26em;
    text-transform: lowercase;
    color: rgba(216, 234, 246, 0.88);
    text-shadow:
      0 0 30px rgba(150, 195, 225, 0.35),
      0 0 90px rgba(110, 160, 200, 0.22);
    padding-left: 0.26em;
  }

  .content p {
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: clamp(0.62rem, 1.4vw, 0.82rem);
    font-weight: 300;
    letter-spacing: 0.52em;
    text-transform: uppercase;
    color: rgba(163, 194, 216, 0.45);
    padding-left: 0.52em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="sky"></div>
  <div class="glow"></div>
  <div class="clouds" id="clouds"></div>

  <div class="trees trees-far"  id="treesFar"></div>
  <div class="trees trees-mid"  id="treesMid"></div>
  <div class="fog fog-a"></div>
  <div class="trees trees-near" id="treesNear"></div>
  <div class="fog fog-b"></div>

  <canvas id="rain"></canvas>
  <div class="vignette"></div>

  <div class="content">
    <h1>rainfall</h1>
    <p>a quiet storm</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const rand = (a, b) => a + Math.random() * (b - a);

  /* =========================================================
     CLOUDS
  ========================================================= */
  (function buildClouds() {
    const wrap = document.getElementById('clouds');
    for (let i = 0; i < 8; i++) {
      const c = document.createElement('div');
      c.className = 'cloud';
      const size = rand(28, 68);
      c.style.width  = size + 'vw';
      c.style.height = (size * rand(0.32, 0.55)) + 'vw';
      c.style.left   = rand(-18, 78) + '%';
      c.style.top    = rand(-12, 48) + '%';
      c.style.opacity = rand(0.22, 0.6).toFixed(2);
      c.style.animationDuration = rand(34, 78).toFixed(1) + 's';
      c.style.animationDelay = (-rand(0, 45)).toFixed(1) + 's';
      wrap.appendChild(c);
    }
  })();

  /* =========================================================
     TREES
  ========================================================= */
  function pinePath(cx, baseY, h, w) {
    const n = 5;
    let d = '';

    // trunk
    const tw = Math.max(1.6, w * 0.085);
    d += `M${cx - tw},${baseY} `
       + `L${cx - tw * 0.62},${baseY - h * 0.24} `
       + `L${cx + tw * 0.62},${baseY - h * 0.24} `
       + `L${cx + tw},${baseY} Z`;

    // foliage layers
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const apexY    = baseY - h + h * 0.48 * t;
      const layerBaseY = apexY + h * 0.42;
      const halfW    = (w * 0.5) * (0.30 + 0.70 * t);
      d += `M${cx - halfW},${layerBaseY} `
         + `L${cx},${apexY} `
         + `L${cx + halfW},${layerBaseY} Z`;
    }
    return d;
  }

  const LAYERS = [
    {
      id: 'treesFar', fill: '#16242f', spacing: 34,
      hMin: 0.42, hMax: 0.74, yJitter: 0.10,
      angMin: 0.8, angMax: 1.9, durMin: 5.5, durMax: 9.5
    },
    {
      id: 'treesMid', fill: '#0d1721', spacing: 52,
      hMin: 0.55, hMax: 0.92, yJitter: 0.08,
      angMin: 1.2, angMax: 2.7, durMin: 4.5, durMax: 8.0
    },
    {
      id: 'treesNear', fill: '#05090d', spacing: 78,
      hMin: 0.60, hMax: 1.00, yJitter: 0.05,
      angMin: 1.6, angMax: 3.3, durMin: 4.0, durMax: 7.2
    }
  ];

  function buildLayer(cfg) {
    const el = document.getElementById(cfg.id);
    if (!el) return;

    const w = el.clientWidth;
    const h = el.clientHeight;
    if (!w || !h) return;

    el.innerHTML = '';

    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('preserveAspectRatio', 'none');

    const count = Math.max(6, Math.round(w / cfg.spacing));
    const slot = w / count;

    for (let i = 0; i < count; i++) {
      const th = rand(cfg.hMin, cfg.hMax) * h;
      const tw = th * rand(0.34, 0.50);
      const cx = (i + 0.5) * slot + rand(-0.34, 0.34) * slot;
      const baseY = h - rand(0, cfg.yJitter) * h;

      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'tree');
      g.style.setProperty('--ang',   rand(cfg.angMin, cfg.angMax).toFixed(2));
      g.style.setProperty('--dur',   rand(cfg.durMin, cfg.durMax).toFixed(2) + 's');
      g.style.setProperty('--delay', (-rand(0, 9)).toFixed(2) + 's');

      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', pinePath(cx, baseY, th, tw));
      p.setAttribute('fill', cfg.fill);

      g.appendChild(p);
      svg.appendChild(g);
    }

    el.appendChild(svg);
  }

  function buildAllLayers() {
    LAYERS.forEach(buildLayer);
  }

  /* =========================================================
     RAIN
  ========================================================= */
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let drops = [];
  let windPhase = 0;
  let last = 0;

  const BUCKETS = 6;
  const paths = Array.from({ length: BUCKETS }, () => new Path2D());

  function makeDrop(spread) {
    const depth = Math.random();           // 0 = far, 1 = near
    return {
      x: Math.random() * (W + 400) - 200,
      y: spread ? Math.random() * H : -rand(20, H * 0.45),
      speed: 480 + depth * 900 + Math.random() * 220,
      len: 9 + depth * 26 + Math.random() * 12,
      depth,
      alpha: 0.06 + depth * 0.36
    };
  }

  function buildDrops() {
    const count = Math.min(1200, Math.round((W * H) / 4000));
    drops = new Array(count);
    for (let i = 0; i < count; i++) drops[i] = makeDrop(true);
  }

  function resizeRain() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = 'round';
    buildDrops();
  }

  function frame(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0.016;
    last = now;
    windPhase += dt;

    // gusting wind
    const wind = 145
      + Math.sin(windPhase * 0.62) * 78
      + Math.sin(windPhase * 1.87) * 26
      + Math.sin(windPhase * 0.21) * 40;

    for (let b = 0; b < BUCKETS; b++) paths[b] = new Path2D();

    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];

      d.y += d.speed * dt;
      d.x += wind * dt * (0.55 + d.depth * 0.75);

      if (d.y > H + 60 || d.x > W + 220) {
        const nd = makeDrop(false);
        nd.x = Math.random() * (W + 500) - 320;
        drops[i] = nd;
        continue;
      }

      const angle = Math.atan2(wind, d.speed);
      const dx = Math.sin(angle) * d.len;
      const dy = Math.cos(angle) * d.len;

      const bi = Math.min(BUCKETS - 1, (d.depth * BUCKETS) | 0);
      paths[bi].moveTo(d.x, d.y);
      paths[bi].lineTo(d.x - dx, d.y - dy);
    }

    ctx.clearRect(0, 0, W, H);

    for (let b = 0; b < BUCKETS; b++) {
      ctx.strokeStyle = `rgba(198, 224, 245, ${(0.05 + b * 0.076).toFixed(3)})`;
      ctx.lineWidth = 0.5 + b * 0.30;
      ctx.stroke(paths[b]);
    }

    requestAnimationFrame(frame);
  }

  /* =========================================================
     BOOT + RESIZE
  ========================================================= */
  function boot() {
    resizeRain();
    buildAllLayers();
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resizeRain();
      buildAllLayers();
    }, 220);
  });

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(boot, 0);
  } else {
    window.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>
</body>
</html>
